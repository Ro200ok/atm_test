name: atm_test
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  get_it: ^8.0.3
  intl: ^0.19.0
  freezed: ^2.5.8

  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/atm_logo.png

  fonts:
    - family: Sf Pro
      fonts:
        - asset: assets/fonts/SFProText-Regular.ttf
          style: normal
flutter_intl:
  enabled: true
